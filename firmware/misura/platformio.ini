; Firmware di misura (fase 1 dello studio VoLoRa V3). NON e' il firmware V3.
; Stesse versioni di piattaforma e di RadioLib della v2 (VoLoRa v0.1.0-rc.1), per confrontare i risultati.
;   pio run -e t3        LILYGO LoRa32 T3 V1.6.1 (SX1278)
;   pio run -e tbeam1262 LILYGO T-Beam V1.2 col modulo SX1262
;   pio run -e tbeam1278 LILYGO T-Beam V1.2 col modulo SX1278
;   make test            prove della logica sul PC

[platformio]
default_envs = t3

[common]
platform = espressif32 @ 6.10.0
board = esp32dev
board_build.flash_size = 4MB
framework = arduino
monitor_speed = 921600
lib_deps =
    jgromes/RadioLib @ 7.5.0
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:t3]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:tbeam1262]
extends = common
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib @ 0.2.6
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; T-Beam V1.2 col modulo SX1278 (stessi pin del modulo SX1262, cambia il chip)
[env:tbeam1278]
extends = common
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib @ 0.2.6
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
