; Firmware V3. STUDIO: mai eseguito su una scheda.
;   pio run -e mobile_t3          scheda MOBILE completa: Bluetooth LE (Android, app) + Wi-Fi della scheda su richiesta (iPhone, pagina nella scheda), LILYGO LoRa32 T3 V1.6.1 (SX1278)
;   pio run -e mobile_tbeam1262   idem, LILYGO T-Beam V1.2 col modulo SX1262
;   pio run -e mobile_tbeam1278   idem, LILYGO T-Beam V1.2 col modulo SX1278
;   pio run -e ble_sim_t3 / ble_sim_tbeam1262   solo il ponte BLE con la radio SIMULATA (modello a tempo del nucleo, nessuna trasmissione)
;   pio run -e bench_t3 / bench_tbeam1262       prova a banco fra due schede (mezzo + radio, senza Bluetooth)
;   make test              prove del nucleo sul PC (contro i vettori del riferimento Python)
; Stesse versioni di piattaforma della v2 e del firmware di misura.

[platformio]
default_envs = mobile_t3

[common]
platform = espressif32 @ 6.10.0
board = esp32dev
board_build.flash_size = 4MB
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

[env:ble_sim_t3]
extends = common
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:ble_sim_tbeam1262]
extends = common
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; PROVA A BANCO fra due schede (medium + driver radio, senza Bluetooth): pio run -e bench_t3 / bench_tbeam1262
[env:bench_t3]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:bench_tbeam1262]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; SCHEDA MOBILE COMPLETA: Bluetooth LE sempre acceso (Android, app VoLoRa-V3.apk) e Wi-Fi della scheda con la pagina del telefono dentro, SPENTO all'avvio (iPhone: tasto BOOT 2 s o WIFI ON).
; Partizioni "huge_app" (app da 3 MB, senza aggiornamento via radio): il firmware con Bluetooth, Wi-Fi e server web non entra nei 1,3 MB predefiniti. NVS resta a 0x9000 e boot_app0 a 0xe000: nominativo e accoppiamento si conservano.
[env:mobile_t3]
extends = common
board_build.partitions = huge_app.csv
extra_scripts =
    pre:tools/git_version.py
    pre:tools/embed_site.py
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib @ 7.5.0
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
build_src_filter = -<*> +<main_mobile.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:mobile_tbeam1262]
extends = common
board_build.partitions = huge_app.csv
extra_scripts =
    pre:tools/git_version.py
    pre:tools/embed_site.py
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
build_src_filter = -<*> +<main_mobile.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; T-Beam V1.2 col modulo SX1278 (stessi pin del modulo SX1262, cambia il chip): scheda mobile completa e prova a banco
[env:mobile_tbeam1278]
extends = common
board_build.partitions = huge_app.csv
extra_scripts =
    pre:tools/git_version.py
    pre:tools/embed_site.py
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
build_src_filter = -<*> +<main_mobile.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12

[env:bench_tbeam1278]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
