; Firmware V3. STUDIO: mai eseguito su una scheda.
;   pio run -e mobile_t3          scheda MOBILE completa (telefono BLE -> ponte -> mezzo -> radio vera), LILYGO LoRa32 T3 V1.6.1 (SX1278)
;   pio run -e mobile_tbeam1262   idem, LILYGO T-Beam V1.2 col modulo SX1262
;   pio run -e ble_sim_t3 / ble_sim_tbeam1262   solo il ponte BLE con la radio SIMULATA (modello a tempo del nucleo, nessuna trasmissione)
;   pio run -e bench_t3 / bench_tbeam1262       prova a banco fra due schede (mezzo + radio, senza Bluetooth)
;   make test              prove del nucleo sul PC (contro i vettori del riferimento Python)
; Stesse versioni di piattaforma della v2 e del firmware di misura.

[platformio]
default_envs = mobile_t3

[common]
platform = espressif32 @ 6.10.0
board = esp32dev
board_build.flash_size = 4MB
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

[env:ble_sim_t3]
extends = common
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:ble_sim_tbeam1262]
extends = common
build_src_filter = -<*> +<main.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; PROVA A BANCO fra due schede (medium + driver radio, senza Bluetooth): pio run -e bench_t3 / bench_tbeam1262
[env:bench_t3]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:bench_tbeam1262]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; SCHEDA MOBILE COMPLETA: Bluetooth + mezzo + radio vera
[env:mobile_t3]
extends = common
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib @ 7.5.0
build_src_filter = -<*> +<main_mobile.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:mobile_tbeam1262]
extends = common
lib_deps =
    ${common.lib_deps}
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
build_src_filter = -<*> +<main_mobile.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262
