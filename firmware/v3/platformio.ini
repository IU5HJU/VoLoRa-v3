; Firmware V3, scheda MOBILE (telefono <-> scheda via BLE). STUDIO: la radio e' ancora il MODELLO A TEMPO del nucleo (nessuna trasmissione vera).
;   pio run -e t3          LILYGO LoRa32 T3 V1.6.1 (SX1278)
;   pio run -e tbeam1262   LILYGO T-Beam V1.2 col modulo SX1262
;   make test              prove del nucleo sul PC (contro i vettori del riferimento Python)
; Stesse versioni di piattaforma della v2 e del firmware di misura.

[platformio]
default_envs = t3

[common]
platform = espressif32 @ 6.10.0
board = esp32dev
board_build.flash_size = 4MB
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 1.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0

[env:t3]
extends = common
build_src_filter = +<*> -<main_bench.cpp> -<radio_board.h>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:tbeam1262]
extends = common
build_src_filter = +<*> -<main_bench.cpp> -<radio_board.h>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262

; PROVA A BANCO fra due schede (medium + driver radio, senza Bluetooth): pio run -e bench_t3 / bench_tbeam1262
[env:bench_t3]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:bench_tbeam1262]
extends = common
lib_deps =
    jgromes/RadioLib @ 7.5.0
    lewisxhe/XPowersLib @ 0.2.6
build_src_filter = -<*> +<main_bench.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262
