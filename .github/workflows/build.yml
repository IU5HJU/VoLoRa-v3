name: Build

# Firmware di misura (studio VoLoRa V3): prove sul PC, compilazione per le schede e pagina di installazione su GitHub Pages.
#   t3         LILYGO LoRa32 T3 V1.6.1 (SX1278)       artefatto firmware-t3
#   tbeam1262  LILYGO T-Beam V1.2 con radio SX1262    artefatto firmware-tbeam1262
# Ogni artefatto contiene web_factory.bin: immagine completa da scrivere all'indirizzo 0 (flasher web, esp-web-tools).
# Su main il job "pages" pubblica su GitHub Pages la pagina (cartella site/) con i binari appena compilati.
# Richiede, una volta sola: Settings -> Pages -> Source: GitHub Actions.
# NOTA: il workflow non e' ancora stato eseguito: il primo giro puo' mostrare errori da correggere.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Prove sul PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Logica del firmware di misura
        run: make -C firmware/misura test
      - name: Simulatore del protocollo immagini
        run: python3 tests/sim/test_sim_immagini.py
      - name: "Simulatore immagini, stesso risultato dopo la separazione in mittente, ricevitore e collegamento"
        run: python3 tests/sim/test_golden_sim_immagini.py
      - name: Simulatore mesh
        run: python3 tests/sim/test_sim_mesh.py
      - name: Prove codice a fontana
        run: python3 tests/sim/test_fontana.py
      - name: Prove frame mesh
        run: python3 tests/sim/test_frame_mesh.py
      - name: Prove elezione voting
        run: python3 tests/sim/test_voting.py
      - name: Prove incapsulamento seriale
        run: python3 tests/sim/test_uart_frame.py
      - name: Prove parametri modulo Ebyte
        run: python3 tests/sim/test_ebyte_e28.py
      - name: Prove tabella dei canali
        run: python3 tests/sim/test_canali.py
      - name: Prove nodo a scheda singola
        run: python3 tests/sim/test_nodo_semplice.py
      - name: Prove configurazione del nodo
        run: python3 tests/sim/test_config_nodo.py
      - name: Prove ascolto del nodo
        run: python3 tests/sim/test_ascolto_nodo.py
      - name: Prove reflector V3
        run: python3 tests/sim/test_reflector_v3.py
      - name: Interoperabilita' del reflector V3 con il vlnode della v2
        run: python3 tests/interop/test_reflector_vs_vlnode.py
      - name: Reflector V3 in C++ (patch sulla v2 e prove con ASan/UBSan)
        run: |
          reflector/build.sh "$RUNNER_TEMP/refl"
          for t in test_reflector_core test_node_link test_reflector_v3; do "$RUNNER_TEMP/refl/build/$t"; done
      - name: Interoperabilita' del reflector V3 in C++ con vlnode e client V3
        run: python3 tests/interop/test_reflector_cpp.py
      - name: Ponte BLE telefono-scheda
        run: python3 tests/sim/test_ble_bridge.py
      - name: Installa Pillow e numpy (immagine a livelli)
        run: pip install pillow numpy
      - name: Nucleo del firmware V3 (C++, ASan e UBSan, contro i vettori del riferimento Python)
        run: make -C firmware/v3 test
      - name: I vettori del firmware V3 sono aggiornati
        run: python3 tests/sim/test_vettori_firmware.py
      - name: Immagine a livelli (JPEG progressivo)
        run: python3 tests/sim/test_immagine_livelli.py
      - name: Trasformatore JPEG progressivo in JavaScript
        run: python3 tests/sim/test_jpeg_prog_js.py
      - name: Limiti dei chip dai datasheet
        run: python3 tests/sim/test_limiti_chip.py
      - name: Prove moduli UART finti
        run: python3 tests/app/test_uartlink.py
      - name: "Applicazione, logica"
        run: python3 tests/app/test_core.py
      - name: "Applicazione, orologio, GPS e prove sul campo"
        run: |
          python3 tests/app/test_timesync.py
          python3 tests/app/test_field.py
          python3 tests/app/test_bluetooth.py
      - name: "Applicazione, interfaccia (schermo virtuale)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb python3-pil
          xvfb-run -a python3 tests/app/test_gui.py
      - name: Pilota dal PC con schede finte
        run: |
          python3 tools/misura.py scala --simulate --modes L4,F3 --att 100,110 --out "$RUNNER_TEMP/sim.csv" --count 50
          python3 tools/misura.py analizza "$RUNNER_TEMP/sim.csv"

  firmware-v3:
    name: Firmware V3 mobile ${{ matrix.board }} (compila)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: mobile_t3
            board: T3 V1.6.1 completa (Bluetooth + Wi-Fi)
          - env: mobile_tbeam1262
            board: T-Beam V1.2 SX1262 completa (Bluetooth + Wi-Fi)
          - env: ble_sim_t3
            board: T3 solo BLE (radio simulata)
          - env: ble_sim_tbeam1262
            board: T-Beam solo BLE (radio simulata)
          - env: bench_t3
            board: T3 prova a banco
          - env: bench_tbeam1262
            board: T-Beam prova a banco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache di PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-v3-${{ runner.os }}-${{ hashFiles('firmware/v3/platformio.ini') }}
      - name: Installa PlatformIO
        run: pip install platformio==6.1.19
      - name: Compila (guscio + nucleo)
        working-directory: firmware/v3
        run: pio run -e ${{ matrix.env }}
      - name: Raccogli i binari per il flasher (quattro parti, le impostazioni restano)
        run: |
          set -euo pipefail
          B=firmware/v3/.pio/build/${{ matrix.env }}
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          mkdir -p dist
          cp "$B/bootloader.bin" "$B/partitions.bin" "$B/firmware.bin" "$BOOT_APP0" dist/
          (cd dist && sha256sum *.bin > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-v3-${{ matrix.env }}
          path: dist/*
          if-no-files-found: error

  firmware:
    name: Firmware ${{ matrix.board }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: t3
            board: T3 V1.6.1
            artifact: firmware-t3
          - env: tbeam1262
            board: T-Beam V1.2 SX1262
            artifact: firmware-tbeam1262
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache di PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/misura/platformio.ini') }}
      - name: Installa PlatformIO ed esptool
        run: pip install platformio==6.1.19 esptool==4.8.1
      - name: Compila
        working-directory: firmware/misura
        run: pio run -e ${{ matrix.env }}
      - name: Crea l'immagine per il flasher
        run: |
          set -euo pipefail
          B=firmware/misura/.pio/build/${{ matrix.env }}
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          mkdir -p dist
          esptool.py --chip esp32 merge_bin -o dist/web_factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"
          (cd dist && sha256sum web_factory.bin > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  app-android:
    name: App Android (APK, Bluetooth LE)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Dipendenze e pagina (www)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-www.js
      - name: Progetto Android (Capacitor)
        working-directory: app
        run: |
          npx cap add android
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          CODE=$(git rev-list --count HEAD)
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          npx cap sync android
      - name: Compila l'APK
        working-directory: app/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Prepara il file
        run: |
          mkdir -p dist-apk
          cp app/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/VoLoRa-V3.apk
          (cd dist-apk && sha256sum VoLoRa-V3.apk > SHA256SUMS && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: volora3-apk
          path: dist-apk/*
          if-no-files-found: error

  pages:
    name: Pubblica su GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [firmware, firmware-v3, app-android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
      - uses: actions/download-artifact@v4          # l'APK ha un altro nome (volora3-apk): il pattern firmware-* non lo prende
        with:
          name: volora3-apk
          path: dist/volora3-apk
      - name: Assembla il sito
        run: |
          set -euo pipefail
          REQUIRE_APK=1 tools/make_site.sh dist _site "main-$(TZ=Europe/Rome date +%d/%m/%Y)" "$GITHUB_SHA"
          find _site -type f | sort
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prova la pagina (logica; il flasher non si prova)
        env:
          PW_CHANNEL: chrome
        run: |
          npm install --no-save playwright@1.49.1
          test -x /opt/google/chrome/chrome || { echo "Chrome non trovato sul runner"; exit 1; }
          node tests/page/run.js _site
          node tests/page/run_nodo.js _site
          node tests/page/run_telefono.js _site
          node tests/page/run_telefono_ws.js _site
          node tests/page/run_app_shim.js _site
          node tests/page/run_v3.js _site
      - uses: actions/configure-pages@v5
        with:
          # prova ad attivare Pages da solo; con il token di default puo' non essere permesso (allora: Settings -> Pages -> Source: GitHub Actions)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Attendi che l'artefatto del sito sia visibile
        run: sleep 30
      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
